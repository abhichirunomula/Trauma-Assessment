{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Check-in | Harbor</title><link rel="stylesheet" href="{% static 'assessment/styles.css' %}"></head><body><main class="shell"><a class="brand" href="{% url 'home' %}">HARBOR</a><form method="post" class="card">{% csrf_token %}<p class="eyebrow">CHECK-IN</p><h1>{{ question }}</h1>{% if form.errors %}<p class="error" role="alert">Choose one option to continue.</p>{% endif %}<div class="choices">{% for choice in form.value %}<label class="choice">{{ choice.tag }}<span>{{ choice.choice_label }}</span><b>→</b></label>{% endfor %}</div><button class="button" type="submit">Continue</button></form></main></body></html>
