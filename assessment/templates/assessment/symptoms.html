{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Symptoms | Harbor</title><link rel="stylesheet" href="{% static 'assessment/styles.css' %}"></head><body><main class="shell"><a class="brand" href="{% url 'home' %}">HARBOR</a><form method="post" class="card">{% csrf_token %}<p class="eyebrow">SYMPTOMS</p><h1>What have you noticed recently?</h1><p class="subtle">Select all that apply.</p>{% if form.errors %}<p class="error" role="alert">{{ form.symptoms.errors|join:", " }}</p>{% endif %}<div class="check-grid">{% for choice in form.symptoms %}<label class="choice">{{ choice.tag }}<span>{{ choice.choice_label }}</span></label>{% endfor %}</div><button class="button" type="submit">Continue</button></form></main><script src="{% static 'assessment/app.js' %}"></script></body></html>
